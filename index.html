  .field input{height:60px;font-size:17px}.field label{top:20px;font-size:17px}
  .btn{height:56px;font-size:17px}
  .bg{transform:translate3d(calc(var(--px,0)*-10px),calc(var(--py,0)*-6px),0) scale(1.1)}
}

/* 樱花与光尘：单个 canvas，叠在卡片上方 */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}

/* ===== 液态玻璃 ===== */
.wrap{position:relative;z-index:2;width:min(404px,calc(100vw - 32px))}
.card{position:relative;padding:26px 28px 26px;border-radius:30px;overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(90,40,120,.16) 50%,rgba(255,255,255,.14));
  box-shadow:0 36px 80px rgba(60,15,100,.5),inset 0 2px 1px rgba(255,255,255,.75),inset 0 -3px 8px rgba(255,255,255,.26),inset 14px 14px 34px rgba(255,255,255,.12),inset -12px -16px 36px rgba(255,170,220,.14)}
.refract{position:absolute;inset:0;border-radius:inherit;z-index:0;-webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%)}
/* 避免 SVG 位移滤镜在卡片高度过渡时重新采样，导致底部按钮看起来缩放 */
@media (hover:hover) and (pointer:fine){.refract{-webkit-backdrop-filter:blur(16px) saturate(190%);backdrop-filter:blur(16px) saturate(190%) brightness(1.04)}}
.rim{position:absolute;inset:0;border-radius:inherit;padding:2px;pointer-events:none;z-index:3;
  background:conic-gradient(from 200deg,#bff6ff,#fff,#ffa6dc,rgba(255,255,255,.12) 55%,#d3c2ff,#bff6ff);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glint{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;background:radial-gradient(380px circle at var(--mx,25%) var(--my,0%),rgba(255,255,255,.4),transparent 58%);mix-blend-mode:soft-light}
.in{position:relative;z-index:4}

.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;margin-bottom:22px;border-radius:16px;background:rgba(60,15,90,.22);box-shadow:inset 0 2px 6px rgba(50,10,80,.3)}
.tabs button{position:relative;z-index:1;height:42px;border:0;background:none;color:var(--ink2);font:inherit;font-weight:600;letter-spacing:.14em;cursor:pointer;transition:color .3s}
.tabs button[aria-selected=true]{color:#fff}
.pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:12px;background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.2));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.85),0 6px 16px rgba(80,30,150,.3);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
body[data-mode=signup] .pill{transform:translateX(100%)}

h1{font-family:var(--display);font-weight:500;font-size:36px;letter-spacing:.22em;text-indent:.22em;text-align:center;text-shadow:0 2px 18px rgba(70,15,100,.6)}
.sub{margin:10px 0 24px;text-align:center;font-size:14px;letter-spacing:.05em;color:var(--ink2);text-shadow:0 1px 8px rgba(70,15,100,.55);min-height:21px}
.sw1{animation:ti .4s ease both}@keyframes ti{from{opacity:0;transform:translateY(6px)}}
.panes{margin:-6px;padding:6px;overflow:hidden;transition:height .5s cubic-bezier(.3,1,.4,1);contain:layout}
.pane{animation:pi .4s cubic-bezier(.2,.8,.2,1)}@keyframes pi{from{opacity:0;transform:translateY(12px)}}

.field{position:relative;margin-bottom:12px}
.field input{width:100%;height:56px;padding:22px 48px 6px 18px;font:inherit;font-size:16px;color:#fff;background:rgba(60,15,90,.2);border:1.5px solid rgba(255,255,255,.4);border-radius:16px;outline:none;
  box-shadow:inset 0 2px 6px rgba(50,10,80,.25),inset 0 -1px 0 rgba(255,255,255,.22);transition:border-color .2s,box-shadow .2s,background .2s}
.field input:focus{border-color:#fff;background:rgba(60,15,90,.3);box-shadow:inset 0 2px 6px rgba(50,10,80,.2),0 0 0 4px rgba(255,126,182,.42),0 0 22px rgba(255,200,230,.4)}
.field label{position:absolute;left:18px;top:18px;font-size:16px;color:var(--ink2);pointer-events:none;transform-origin:left top;transition:transform .2s}
.field input:focus+label,.field input:not(:placeholder-shown)+label{transform:translateY(-11px) scale(.74)}
.field.bad input{border-color:#ff7a9c}
.eye{position:absolute;right:6px;top:6px;width:44px;height:44px;border:0;border-radius:14px;background:none;color:var(--ink2);cursor:pointer;display:grid;place-items:center}
.msg{min-height:18px;margin:2px 6px 8px;font-size:13px;color:#ffe0ea;text-shadow:0 1px 6px rgba(120,20,80,.7)}

.meter{display:flex;align-items:center;gap:6px;margin:-2px 4px 8px;font-size:12px;color:var(--ink2)}
.meter i{width:16px;height:12px;border-radius:100% 0 100% 0;background:rgba(255,255,255,.24);transition:background .3s,transform .4s cubic-bezier(.3,1.8,.5,1)}
.meter i.on{background:radial-gradient(circle at 30% 30%,#fff,#ffb3d1 50%,#ff7eb6);transform:scale(1.25) rotate(-14deg)}
.meter span{margin-left:6px}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 16px;font-size:14px;min-height:28px}
a{color:var(--link);text-decoration:none;font-weight:600}a:hover{text-decoration:underline}
.chk{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--ink2)}
.chk input{position:absolute;opacity:0}
.sw{flex:none;width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.26);box-shadow:inset 0 1px 3px rgba(50,10,90,.35);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(60,10,110,.4);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.chk input:checked+.sw{background:linear-gradient(90deg,var(--pink),var(--violet))}
.chk input:checked+.sw::after{transform:translateX(18px)}
.chk input:focus-visible+.sw{outline:3px solid #fff;outline-offset:2px}

.btn{position:relative;overflow:hidden;width:100%;height:52px;border:0;border-radius:16px;font:inherit;font-size:16px;font-weight:600;letter-spacing:.1em;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.primary{background:linear-gradient(115deg,#ff8fb8,#b58cff 62%,#8fc9ff);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -10px 16px rgba(255,255,255,.16),0 12px 28px rgba(150,90,230,.5),0 0 0 1px rgba(255,255,255,.25)}
.ghost{margin-top:10px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.4);box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
.btn[disabled]{cursor:default}
.rp{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;background:rgba(255,255,255,.6);pointer-events:none;animation:rp .7s ease-out forwards}
@keyframes rp{to{transform:scale(26);opacity:0}}
.btn:focus-visible,a:focus-visible,.eye:focus-visible,.tabs button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.or{display:flex;align-items:center;gap:12px;margin:14px 0 2px;font-size:13px;color:var(--ink2)}
.or::before,.or::after{content:"";height:1px;flex:1;background:rgba(255,255,255,.32)}
.foot{margin-top:18px;text-align:center;font-size:14px;color:var(--ink2)}
.done{text-align:center;padding:10px 0 4px}
.done p{margin:8px 0 22px;color:var(--ink2);font-size:14px}
.okring{display:block;margin:0 auto 18px;width:64px;height:64px;padding:17px;border-radius:50%;color:#fff;background:rgba(255,255,255,.22);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 10px 26px rgba(80,30,150,.4);animation:pop .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.card.signed form,.card.signed .tabs,.card.signed .head,.card.signed .foot{display:none!important}
.shake{animation:shake .4s}@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

<body data-mode="login">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="lg"><feTurbulence type="fractalNoise" baseFrequency=".011 .015" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="30" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div class="bg" id="bg" aria-hidden="true"></div><div class="shade"></div><div class="dusk"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main class="wrap">
  <div class="card" id="card">
    <div class="refract"></div><div class="glint"></div><div class="rim"></div>
    <div class="in">
      <div class="tabs" role="tablist">
        <i class="pill"></i>
        <button type="button" role="tab" aria-selected="true" data-go="login">登录</button>
        <button type="button" role="tab" aria-selected="false" data-go="signup">注册</button>
      </div>
      <div class="head"><h1 id="ttl">おかえり</h1><p class="sub" id="sub">欢迎回来，登录以继续你的旅程</p></div>

      <div class="panes" id="panes">
        <form class="pane" id="login" novalidate>
          <div class="field"><input id="l-email" type="email" placeholder=" " autocomplete="username" inputmode="email"><label for="l-email">邮箱</label></div>
          <div class="field"><input id="l-pw" type="password" placeholder=" " autocomplete="current-password"><label for="l-pw">密码</label><button class="eye" type="button" data-eye="l-pw" aria-label="显示密码"></button></div>
          <p class="msg" role="alert"></p>
          <div class="row"><label class="chk"><input type="checkbox" checked><span class="sw"></span>保持登录</label><a href="#forgot">忘记密码？</a></div>
          <button class="btn primary" type="submit" data-t="登录">登录</button>
          <div class="or">或</div>
          <button class="btn ghost" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg>使用通行密钥登录</button>
        </form>

        <form class="pane" id="signup" novalidate hidden>
          <div class="field"><input id="s-nick" type="text" placeholder=" " autocomplete="nickname" maxlength="16"><label for="s-nick">昵称</label></div>
          <div class="field"><input id="s-email" type="email" placeholder=" " autocomplete="email" inputmode="email"><label for="s-email">邮箱</label></div>
          <div class="field"><input id="s-pw" type="password" placeholder=" " autocomplete="new-password"><label for="s-pw">设置密码</label><button class="eye" type="button" data-eye="s-pw" aria-label="显示密码"></button></div>
          <div class="meter" id="meter" aria-live="polite"><i></i><i></i><i></i><i></i><i></i><span id="mt">至少 8 个字符</span></div>
          <p class="msg" role="alert"></p>
          <div class="row"><label class="chk"><input type="checkbox" id="s-agree"><span class="sw"></span>同意<a href="#terms">服务条款</a></label></div>
          <button class="btn primary" type="submit" data-t="创建账户">创建账户</button>
        </form>
      </div>

      <p class="foot" id="foot"></p>

      <div class="done" id="done" hidden aria-live="polite">
        <svg class="okring" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <h1 id="dt"></h1><p id="dp"></p>
        <button class="btn ghost" type="button" id="back" style="margin:0;display:flex">返回</button>
      </div>
    </div>
  </div>
</main>

<script>
const $=id=>document.getElementById(id),R=Math.random;
const card=$('card'),panes=$('panes'),bg=$('bg');
const fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ===== 樱花与光尘：单个 canvas，叠在卡片上方（不会触发毛玻璃重算） ===== */
const cv=$('fx'),cx=cv.getContext('2d');
let W=0,H=0,dpr=1,night=0,mx=-999,my=-999,mvx=0,mvy=0,mt=-1e9;
const petalSprite=(c0,c1,c2)=>{const s=document.createElement('canvas');s.width=64;s.height=48;const g=s.getContext('2d'),
  gr=g.createLinearGradient(32,48,32,0);gr.addColorStop(0,c0);gr.addColorStop(.6,c1);gr.addColorStop(1,c2);g.fillStyle=gr;
  g.beginPath();g.moveTo(32,47);g.bezierCurveTo(4,35,0,6,22,1);g.quadraticCurveTo(32,9,42,1);g.bezierCurveTo(64,6,60,35,32,47);g.fill();
  g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1.2;g.beginPath();g.moveTo(32,44);g.lineTo(32,14);g.stroke();return s};
const SP=[petalSprite('#ff8fbf','#ffc4dc','#fff1f7'),petalSprite('#a98bff','#d3c3ff','#f5f0ff')]; // 粉樱 / 薰衣草紫（夜晚更多）
const glowSprite=rgb=>{const s=document.createElement('canvas');s.width=s.height=48;const g=s.getContext('2d'),gr=g.createRadialGradient(24,24,0,24,24,24);
  gr.addColorStop(0,`rgba(${rgb},1)`);gr.addColorStop(.25,`rgba(${rgb},.55)`);gr.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=gr;g.fillRect(0,0,48,48);return s};
const GL=[glowSprite('255,236,190'),glowSprite('170,220,255')]; // 暖金光尘 / 夜晚萤火
const petals=[],bursts=[],motes=[];
const tone=()=>R()<(night>.5?.7:.12)?1:0;
const mkPetal=init=>{const z=Math.pow(R(),1.4); // z 越大越近：更大、更快、更不透明
  return{z,x:R()*W,y:init?R()*H:-40,s:7+z*19,vy:(.45+z*1.1)*(.7+R()*.6),vx:0,dx:R()*6.28,r:R()*6.28,vr:(R()-.5)*.05,f:R()*6.28,vf:.02+R()*.04,k:tone()}};
const mkBurst=(x,y,vx,vy,s,life)=>({x,y,vx,vy,s,r:R()*6.28,vr:(R()-.5)*.25,f:R()*6.28,vf:.05+R()*.05,k:tone(),life,age:0});

function size(){dpr=Math.min(devicePixelRatio||1,innerWidth<600?1.5:2);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);if(calm)draw(0,0)}
function stamp(p,a){ // f 控制花瓣翻转，模拟三维翻滚
  const sy=.28+.72*Math.abs(Math.cos(p.f)),c=Math.cos(p.r)*dpr,s=Math.sin(p.r)*dpr,w=p.s,h=p.s*.75;
  cx.globalAlpha=a;cx.setTransform(c,s,-s*sy,c*sy,p.x*dpr,p.y*dpr);cx.drawImage(SP[p.k],-w/2,-h/2,w,h)}
function draw(dt,t){
  night+=((document.body.dataset.mode==='signup'?1:0)-night)*.03*dt;
  mvx*=Math.pow(.9,dt);mvy*=Math.pow(.9,dt);
  cx.setTransform(1,0,0,1,0,0);cx.globalCompositeOperation='source-over';cx.clearRect(0,0,cv.width,cv.height);
  // 阵风：持续微风 + 周期性的一阵大风
  const wind=calm?0:.25+.7*Math.pow(Math.max(0,Math.sin(t/3200)),3)+.18*Math.sin(t/950);
  const push=fine&&t-mt<400;
  for(const p of petals){
    if(dt){
      p.vx+=(wind*(.6+p.z*.9)-p.vx)*.025*dt;
      if(push){const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<150&&d>1){const f=1-d/150; // 鼠标划过会吹散花瓣
        p.vx+=(dx/d*.5+mvx*.015)*f*dt;p.y+=(dy/d*1.2+mvy*.02)*f*dt}}
      p.x+=(p.vx+Math.sin(p.y/60+p.dx)*.5*(.5+p.z))*dt;p.y+=p.vy*dt;p.r+=(p.vr+p.vx*.01)*dt;p.f+=p.vf*dt;
      if(p.y>H+40||p.x>W+80||p.x<-120){p.y=-40;p.x=R()*(W+200)-160;p.k=tone()}
    }
    stamp(p,.4+.5*p.z)}
  for(let i=bursts.length-1;i>=0;i--){const p=bursts[i];
    p.vy+=.06*dt;p.vx*=.985;p.age+=dt;if(p.age>=p.life){bursts.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.f+=p.vf*dt;stamp(p,.92*(1-p.age/p.life))}
  // 光尘：登录时是暖金色，切到注册后渐变成蓝色萤火
  cx.setTransform(dpr,0,0,dpr,0,0);cx.globalCompositeOperation='lighter';
  for(const m of motes){
    if(dt){m.ph+=m.sp*dt;m.x+=(m.vx+Math.sin(m.ph)*.12)*dt;m.y+=m.vy*dt;if(m.y<-30){m.y=H+30;m.x=R()*W}}
    const a=(.3+.7*(.5+.5*Math.sin(m.ph*3)))*.7,sz=m.r*7;
    if(night<.98){cx.globalAlpha=a*(1-night);cx.drawImage(GL[0],m.x-sz/2,m.y-sz/2,sz,sz)}
    if(night>.02){cx.globalAlpha=Math.min(1,a*night*1.2);cx.drawImage(GL[1],m.x-sz/2,m.y-sz/2,sz,sz)}}
  cx.globalCompositeOperation='source-over';cx.globalAlpha=1}

size();addEventListener('resize',size);
for(let i=0;i<(innerWidth<600?34:84);i++)petals.push(mkPetal(true));
petals.sort((a,b)=>a.z-b.z);
for(let i=0;i<(innerWidth<600?14:34);i++)motes.push({x:R()*W,y:R()*H,r:1.5+R()*3.5,vx:(R()-.5)*.15,vy:-(.12+R()*.3),ph:R()*6.28,sp:.008+R()*.02});
if(calm)draw(0,0);else{let last=0;const frame=t=>{requestAnimationFrame(frame);
  if(document.hidden){last=t;return}const dt=Math.min(3,(t-last)/16.7)||1;last=t;draw(dt,t)};requestAnimationFrame(frame)}
if(fine)addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;mvx=e.movementX;mvy=e.movementY;mt=performance.now()},{passive:true});

function burst(x,y,n){if(calm)return;n=fine?n:Math.round(n*.6);
  for(let i=0;i<n;i++){const a=R()*6.283,v=2+R()*5.5;bursts.push(mkBurst(x,y,Math.cos(a)*v,Math.sin(a)*v-1.5,9+R()*14,70+R()*60))}
  if(bursts.length>320)bursts.splice(0,bursts.length-320)}
// 打字时，输入框上方会飘起几片花瓣
document.addEventListener('input',e=>{const t=e.target;if(!calm&&t.matches&&t.matches('.field input')&&R()<.7){const r=t.getBoundingClientRect();
  for(let i=0;i<2;i++)bursts.push(mkBurst(r.left+r.width*(.1+R()*.8),r.top+4,(R()-.5)*1.6,-1.6-R()*1.8,9+R()*8,55+R()*35))}});

/* 指针：仅桌面端做高光与视差，并用 rAF 节流 */
if(fine){let raf=0,ev;addEventListener('pointermove',e=>{ev=e;raf||(raf=requestAnimationFrame(()=>{raf=0;
  const r=card.getBoundingClientRect();card.style.setProperty('--mx',(ev.clientX-r.left)+'px');card.style.setProperty('--my',(ev.clientY-r.top)+'px');
  bg.style.setProperty('--px',(ev.clientX/innerWidth-.5)*2);bg.style.setProperty('--py',(ev.clientY/innerHeight-.5)*2)}))})}
addEventListener('pointerdown',e=>{
  if(!e.target.closest('.card'))burst(e.clientX,e.clientY,14);
  const b=e.target.closest('.btn');if(!b)return;const r=b.getBoundingClientRect(),s=document.createElement('i');
  s.className='rp';s.style.cssText=`left:${e.clientX-r.left}px;top:${e.clientY-r.top}px`;b.appendChild(s);setTimeout(()=>s.remove(),700)});

/* 登录 / 注册切换：桌面端高度平滑过渡，手机端直接切换以避免掉帧 */
const T={login:['おかえり','欢迎回来，登录以继续你的旅程'],signup:['はじめまして','创建账户，开始你的旅程']};
const F={login:'还没有账户？<a href="#signup" data-go="signup">立即注册</a>',signup:'已有账户？<a href="#login" data-go="login">返回登录</a>'};
let mode='login', paneTimer=0;
const swap=e=>{e.classList.remove('sw1');void e.offsetWidth;e.classList.add('sw1')};
function setMode(m){
  if(m===mode||card.classList.contains('signed'))return;
  const anim=fine&&!calm;
  clearTimeout(paneTimer);
  // 以当前实际高度为起点，避免快速连续点击时从过期高度重新计算。
  const start=panes.getBoundingClientRect().height;
  if(anim){panes.style.transition='none';panes.style.height=start+'px'}
  else panes.style.height='';
  $(mode).hidden=true;
  const to=$(m);to.hidden=false;
  if(anim){
    // panes 使用 border-box；目标高度必须包含上下各 6px 的 padding。
    const st=getComputedStyle(panes);
    const target=to.offsetHeight+parseFloat(st.paddingTop)+parseFloat(st.paddingBottom);
    void panes.offsetHeight;
    panes.style.transition='';
    panes.style.height=target+'px';
    paneTimer=setTimeout(()=>{panes.style.height=''},520);
  }
  mode=m;document.body.dataset.mode=m;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.go===m));
  $('ttl').textContent=T[m][0];$('sub').textContent=T[m][1];$('foot').innerHTML=F[m];swap($('ttl'));swap($('sub'));
}
$('foot').innerHTML=F.login;
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();setMode(g.dataset.go)}});

const EYE='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
document.querySelectorAll('.eye').forEach(b=>{b.innerHTML=EYE;b.onclick=()=>{const i=$(b.dataset.eye),s=i.type==='password';i.type=s?'text':'password';b.setAttribute('aria-label',s?'隐藏密码':'显示密码')}});

$('s-nick').addEventListener('input',e=>{const v=e.target.value.trim();$('sub').textContent=v?`你好，${v}。创建账户，开始你的旅程`:T.signup[1]});
const score=p=>!p?0:(p.length>=8)+(p.length>=12)+(/[a-z]/.test(p)&&/[A-Z]/.test(p))+/\d/.test(p)+/[^A-Za-z0-9]/.test(p);
const LV=['至少 8 个字符','还很脆弱','再加强一点','不错','很稳','像樱花一样盛开'];
$('s-pw').addEventListener('input',e=>{const s=score(e.target.value);
  [...$('meter').children].slice(0,5).forEach((n,i)=>n.classList.toggle('on',i<s));$('mt').textContent=LV[s]});

function fail(f,input,t){input.closest('.field')?.classList.add('bad');f.querySelector('.msg').textContent=t;card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake')}
document.querySelectorAll('form').forEach(f=>f.addEventListener('input',()=>{f.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));f.querySelector('.msg').textContent=''}));
const mailOK=v=>/^\S+@\S+\.\S+$/.test(v);
function finish(f,title,text,n){
  const b=f.querySelector('.primary');b.disabled=true;b.innerHTML='<span class="spin"></span>请稍候';
  // 演示：此处替换为真实的请求
  setTimeout(()=>{$('dt').textContent=title;$('dp').textContent=text;$('done').hidden=false;card.classList.add('signed');
    const r=card.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/3,n)},1200)}
$('login').addEventListener('submit',e=>{e.preventDefault();const em=$('l-email'),pw=$('l-pw');
  if(!mailOK(em.value.trim()))return fail(e.target,em,'请输入有效的邮箱地址，例如 name@example.com');
  if(pw.value.length<6)return fail(e.target,pw,'密码至少需要 6 个字符');
  finish(e.target,'おかえり','已登录为 '+em.value.trim(),40)});
$('signup').addEventListener('submit',e=>{e.preventDefault();const n=$('s-nick'),em=$('s-email'),pw=$('s-pw');
  if(n.value.trim().length<2)return fail(e.target,n,'昵称至少需要 2 个字符');
  if(!mailOK(em.value.trim()))return fail(e.target,em,'请输入有效的邮箱地址，例如 name@example.com');
  if(pw.value.length<8)return fail(e.target,pw,'密码至少需要 8 个字符');
  if(!$('s-agree').checked)return fail(e.target,$('s-agree'),'请先阅读并同意服务条款');
  finish(e.target,'ようこそ','账户已创建，欢迎你，'+n.value.trim(),70)});
$('back').onclick=()=>{card.classList.remove('signed');$('done').hidden=true;
  document.querySelectorAll('form').forEach(f=>{f.reset();const b=f.querySelector('.primary');b.disabled=false;b.textContent=b.dataset.t});
  [...$('meter').children].forEach(n=>n.classList?.remove('on'));$('mt').textContent=LV[0];$('s-pw').type=$('l-pw').type='password';
  if(mode!=='login')setMode('login');else{$('sub').textContent=T.login[1]}};
</script>
</body>
</html>
